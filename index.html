<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم قبيلة الدرغام</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- رأس الصفحة مع اللوجو -->
        <header>
            <div class="logo-container">
                <img src="logo.png" alt="لوجو قبيلة الدرغام" id="logo">
                <h1>قبيلة الدرغام</h1>
                <p class="subtitle">نظام تقديم طلبات الانضمام</p>
            </div>
        </header>

        <!-- نموذج التقديم -->
        <main>
            <div class="form-container">
                <div class="form-header">
                    <h2><i class="fas fa-file-signature"></i> نموذج التقديم</h2>
                    <p>يرجى ملء جميع الحقول بالمعلومات الصحيحة والدقيقة</p>
                </div>

                <form id="applicationForm">
                    <!-- اليوزر في الدسكورد -->
                    <div class="form-group">
                        <label for="discordUser">
                            <i class="fab fa-discord"></i> يوزر الدسكورد *
                        </label>
                        <input type="text" id="discordUser" name="discordUser" placeholder="أدخل اليوزر الخاص بك (مثال: username#1234)" required>
                        <small class="hint">مهم جداً - أدخل اليوزر كاملاً</small>
                    </div>

                    <!-- الكوبي ايدي ب الديسكورد -->
                    <div class="form-group">
                        <label for="discordId">
                            <i class="fab fa-discord"></i> الكوبي ايدي في الدسكورد *
                        </label>
                        <input type="text" id="discordId" name="discordId" placeholder="أدخل الكوبي ايدي الخاص بك" required>
                        <small class="hint">يمكن أن يكون أي عدد من الأرقام</small>
                    </div>

                    <!-- الاسم -->
                    <div class="form-group">
                        <label for="name">
                            <i class="fas fa-user"></i> الاسم الكامل *
                        </label>
                        <input type="text" id="name" name="name" placeholder="أدخل اسمك الكامل" required>
                    </div>

                    <!-- العمر -->
                    <div class="form-group">
                        <label for="age">
                            <i class="fas fa-birthday-cake"></i> العمر الحقيقي (يجب أن يكون 13+)*
                        </label>
                        <input type="number" id="age" name="age" min="13" max="100" placeholder="أدخل عمرك" required>
                        <small class="hint">يجب أن يكون عمرك 13 سنة أو أكثر للتقديم</small>
                    </div>

                    <!-- سبب التقديم -->
                    <div class="form-group">
                        <label for="reason">
                            <i class="fas fa-question-circle"></i> سبب تقديمك على قبيلة الدرغام *
                        </label>
                        <textarea id="reason" name="reason" rows="3" placeholder="اشرح سبب رغبتك في الانضمام إلى قبيلة الدرغام" required></textarea>
                    </div>

                    <!-- الخبرات  -->
                    <div class="form-group">
                        <label for="experience">
                            <i class="fas fa-chart-line"></i> خبراتك. (اشرح بالتفصيل) *
                        </label>
                        <textarea id="experience" name="experience" rows="4" placeholder="اذكر خبراتك في المجالات قبايل السابقة بالتفصيل" required></textarea>
                    </div>

                    <!-- التفاعل في ال. -->
                    <div class="form-group">
                        <label for="interaction">
                            <i class="fas fa-users"></i> كيف سيكون تفاعلك في القبيلة.؟ *
                        </label>
                        <textarea id="interaction" name="interaction" rows="3" placeholder="صف كيف ستتفاعل وتتعاون مع فريق." required></textarea>
                    </div>

                    <!-- خبرات التصميم والمونتاج -->
                    <div class="form-group">
                        <label for="design">
                            <i class="fas fa-palette"></i> خبراتك في التصميم والمونتاج
                        </label>
                        <textarea id="design" name="design" rows="3" placeholder="اذكر خبراتك في مجالات التصميم أو المونتاج (إن وجدت)"></textarea>
                    </div>

                    <!-- السبب للقبول -->
                    <div class="form-group">
                        <label for="unique">
                            <i class="fas fa-star"></i> ما السبب الذي يجعلنا نقوم بقبولك ولا نقوم بقبول غيرك؟ (اشرح بالتفصيل) *
                        </label>
                        <textarea id="unique" name="unique" rows="4" placeholder="ما الذي يميزك عن الآخرين؟ لماذا يجب أن نختارك؟" required></textarea>
                    </div>

                    <!-- هل سبق ودخلت  قبيلة سابقًا -->
                    <div class="form-group">
                        <label for="previous">
                            <i class="fas fa-history"></i> هل سبق ودخلت قبيلة سابقًا؟ *
                        </label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="previous" value="نعم" required> نعم
                            </label>
                            <label>
                                <input type="radio" name="previous" value="لا" required> لا
                            </label>
                        </div>
                    </div>

                    <!-- تفاصيل القبائل السابقة -->
                    <div class="form-group" id="previousDetails" style="display: none;">
                        <label for="details">
                            <i class="fas fa-list-alt"></i> (في حال كان الجواب نعم) اذكر اسم جميع القبائل ورتبتك وسبب خروجك من القبائل
                        </label>
                        <textarea id="details" name="details" rows="4" placeholder="اذكر اسم القبائل السابقة، الرتبة التي شغلتها، وسبب خروجك من كل قبيلة"></textarea>
                    </div>

                    <!-- شروط التقديم -->
                    <div class="terms">
                        <label>
                            <input type="checkbox" id="agreeTerms" required>
                            أوافق على أن جميع المعلومات التي قدمتها صحيحة، وأعلم أن تقديم معلومات خاطئة سيؤدي إلى رفض طلبي
                        </label>
                    </div>

                    <!-- أزرار التقديم -->
                    <div class="form-actions">
                        <button type="submit" id="submitBtn" class="submit-btn">
                            <i class="fas fa-paper-plane"></i> تقديم الطلب
                        </button>
                        <button type="reset" class="reset-btn">
                            <i class="fas fa-redo"></i> إعادة تعيين
                        </button>
                    </div>
                </form>

                <!-- رسالة النتيجة -->
                <div id="message" class="message"></div>
            </div>
        </main>

        <!-- تذييل الصفحة -->
        <footer>
            <p>© 2023 قبيلة الدرغام. جميع الحقوق محفوظة.</p>
            <p class="footer-note">يتم إرسال الطلبات مباشرة إلى إدارة القبيلة</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
